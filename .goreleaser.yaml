version: 2

builds:
  - main: ./cmd/azie
    binary: azie
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^chore", "^docs", "^ci"]

release:
  github:
    owner: vietz-dev
    name: azie
  # tags with a "-pre." suffix (pushed by the main workflow) become GitHub prereleases
  prerelease: auto
  make_latest: "{{ not .Prerelease }}"
